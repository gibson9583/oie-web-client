name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege by default; individual jobs opt into more if ever needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref so CI stays fast and clean.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: Lint · Typecheck · Unit · Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (incl. @oie/* import-boundary rules)
        run: npm run lint
      - name: Typecheck (@oie/* public type surface)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Audit (production dependencies)
        # Fail on high+ (0 today after the dependency modernization). Full-tree
        # audit is also clean; scoped to prod deps here so a dev-only transitive
        # advisory doesn't block CI. Loosen only with a documented reason.
        run: npm audit --omit=dev --audit-level=high

  artifacts:
    name: Node + WAR · artifact identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check release versions and tag
        run: node tools/release-artifacts.mjs versions
      - name: Build the Node runtime
        run: npm run build -w web-administrator
      - name: Build the WAR and regenerate committed artifacts
        # ubuntu-latest includes a JDK, whose standard `jar` tool is the only
        # non-Node requirement. build:war also runs the normal production build.
        run: npm run build:war
      - name: Fail if any generated artifact drifted from its TypeScript source
        run: |
          if ! git diff --exit-code -- \
              'web-administrator/client/core/*.js' \
              'web-administrator/client/connectors/*.js' \
              'web-administrator/server/*.js' \
              'web-administrator/plugins/*/web/plugin.js' \
              'packages/*/types' 'packages/*/index.d.ts'; then
            echo "::error::A generated artifact differs from its TypeScript source. The"
            echo "::error::.ts/.tsx is the source of truth — never edit the generated .js"
            echo "::error::or packages/*/types by hand. Run 'npm run build' (or the"
            echo "::error::build-core/build-server/build-plugins tools + gen:types) and"
            echo "::error::commit the regenerated files."
            exit 1
          fi

      - name: Package immutable release inputs
        run: node tools/release-artifacts.mjs pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inputs
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0

  e2e:
    name: Playwright · ${{ matrix.browser }}
    needs: artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ui
            browser: chromium
            workers: 4
          - project: firefox
            browser: firefox
            workers: 2
          - project: webkit
            browser: webkit
            workers: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs
          path: release-artifacts
      - name: Verify and use the packaged runtime (no rebuild)
        run: |
          node tools/release-artifacts.mjs verify
          tar -xzf release-artifacts/oie-webadmin-node.tar.gz
      - name: Install Playwright browsers
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      - name: Run browser regressions against the release runtime
        env:
          PROJECT: ${{ matrix.project }}
          WORKERS: ${{ matrix.workers }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: release-artifacts/browser-results.json
        run: npx playwright test --project="$PROJECT" --workers="$WORKERS" --reporter=github,json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # A passing retry still needs its original trace for review.
        if: always()
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: |
            test-results/
            release-artifacts/browser-results.json
          if-no-files-found: ignore

  runtime-inputs:
    name: Pinned engine · 0.9 baseline · companion API
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs
          path: release-artifacts
      - run: node tools/release-artifacts.mjs verify
      - name: Build the pinned 0.9.0 baseline and verify engine inputs
        run: bash tools/prepare-contract-inputs.sh release-artifacts/contracts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gibson9583/oie-web-support-plugin
          ref: d2f6bbd778f131c05ddd13ea0695cc0e1753b24d
          path: release-artifacts/websupport
      - name: Test and package the pinned companion API with this WAR
        run: |
          mkdir release-artifacts/compile-inputs
          tar -xzf release-artifacts/contracts/oie.tar.gz -C release-artifacts/compile-inputs \
            oie/server-lib/mirth-server.jar oie/server-lib/mirth-client-core.jar \
            oie/server-lib/donkey/donkey-model.jar
          mvn -B -ntp -f release-artifacts/websupport/pom.xml package \
            -Doie.home="$GITHUB_WORKSPACE/release-artifacts/compile-inputs/oie" \
            -Dwebclient.war="$GITHUB_WORKSPACE/release-artifacts/oie-webadmin.war"
          cp release-artifacts/websupport/target/websupport-1.0.4.zip release-artifacts/contracts/websupport.zip
          sha256sum release-artifacts/contracts/websupport.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-contract-inputs
          path: release-artifacts/contracts/
          if-no-files-found: error
          compression-level: 0

  runtime:
    name: Owned OIE · ${{ matrix.support }} Web Support
    needs: [artifacts, runtime-inputs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        support: [with, without]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs
          path: release-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-contract-inputs
          path: release-artifacts/contracts
      - name: Verify and test the release artifacts against a fresh engine
        env:
          SUPPORT: ${{ matrix.support }}
        run: |
          node tools/release-artifacts.mjs verify
          tar -xzf release-artifacts/oie-webadmin-node.tar.gz
          extra=()
          if [ "$SUPPORT" = with ]; then
            extra+=(--plugin release-artifacts/contracts/websupport.zip \
              --baseline-node release-artifacts/contracts/baseline-node.tar.gz \
              --baseline-war release-artifacts/contracts/baseline.war)
          fi
          python3 tools/engine-contract.py --archive release-artifacts/contracts/oie.tar.gz \
            --war release-artifacts/oie-webadmin.war --out release-artifacts/evidence "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: engine-evidence-${{ matrix.support }}
          path: release-artifacts/evidence/

  docker:
    needs: [checks, artifacts, e2e, runtime]
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  release:
    if: github.ref_type == 'tag'
    needs: [checks, artifacts, e2e, runtime, docker]
    permissions:
      contents: write
    uses: ./.github/workflows/war-release.yml
