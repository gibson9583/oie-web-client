name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Superseded main-branch builds are cancelled; tag builds always run to completion.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

# Overridable per fork/deployment via repository variables — no workflow edits
# needed. Credentials come from repository secrets:
#   DOCKERHUB_TOKEN     (required) Docker Hub access token
#   DOCKERHUB_USERNAME  (optional) defaults to gibson9583
env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'gibson9583/oie-web-client' }}
  PLATFORMS: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'gibson9583' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # main -> latest; a vX.Y.Z tag -> X.Y.Z and X.Y (latest is NOT moved
          # by releases — it tracks the latest main commit).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto would also move `latest` on release tags; only the
          # explicit rule above (main pushes) may set it.
          flavor: |
            latest=false
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
