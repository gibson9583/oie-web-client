name: Publish validated release artifacts
on:
  workflow_call:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-inputs
          path: release-artifacts
      - name: Verify commit, tag, version and tested artifact hashes
        run: node tools/release-artifacts.mjs verify
      - name: Publish tested artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            extra=()
            [[ "$TAG" != *-* ]] || extra+=(--prerelease)
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes "Deployment options:

          - oie-webadmin.war: embedded OIE deployment
          - oie-webadmin-node.tar.gz: standalone Node.js deployment
          - gibson9583/oie-web-client: Docker deployment" "${extra[@]}"
          fi
          mkdir existing
          for file in release-artifacts/*; do
            name=$(basename "$file")
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$TAG" --pattern "$name" --dir existing
              cmp "$file" "existing/$name"
            else
              gh release upload "$TAG" "$file"
            fi
          done
          gh release edit "$TAG" --draft=false
