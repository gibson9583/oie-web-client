name: WAR Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish WAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Build WAR
        run: npm run build:war
      - name: Validate and digest WAR
        run: |
          jar --list --file web-administrator/dist/oie-webadmin.war | grep -qx 'index.jsp'
          jar --list --file web-administrator/dist/oie-webadmin.war | grep -qx 'WEB-INF/web.xml'
          (cd web-administrator/dist && sha256sum oie-webadmin.war > oie-webadmin.war.sha256)
      - name: Publish WAR release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web-administrator/dist/oie-webadmin.war
            web-administrator/dist/oie-webadmin.war.sha256
          body: |
            Deployment options:

            - `oie-webadmin.war` — embedded OIE deployment
            - `gibson9583/oie-web-client` — Docker deployment
            - repository source — standalone Node.js deployment
          prerelease: ${{ contains(github.ref_name, '-') }}
