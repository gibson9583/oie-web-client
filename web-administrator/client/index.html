<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- build-war replaces these values with the deployed servlet context.
         The standalone Node build keeps its root defaults. -->
    <meta name="oie-webadmin-app-base" content="">
    <meta name="oie-webadmin-api-base" content="/api">
    <title>Open Integration Engine — Administrator</title>
    <!-- Plugins (and the shell bundle's externalized imports) reference the
         framework by the @oie/web-* package names; this maps them to the single
         shared instance the shell serves at core/*.js. URL-prefix aliases keep
         legacy absolute imports working when the app is mounted by a WAR. -->
    <script type="importmap">
    {
      "imports": {
        "@oie/web-api": "/core/pkg-api.js",
        "@oie/web-ui": "/core/pkg-ui.js",
        "@oie/web-shell": "/core/pkg-shell.js",
        "js-beautify": "/vendor/js-beautify.js",
        "qrcode-generator": "/vendor/qrcode-generator.js",
        "/core/": "/core/",
        "/connectors/": "/connectors/",
        "/datatypes/": "/datatypes/",
        "/plugins/": "/plugins/",
        "/vendor/": "/vendor/"
      }
    }
    </script>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" type="image/png" href="/assets/oie_logo_only_white_background_32x32.png">
</head>
<body>
    <div id="app">
        <div class="boot-splash">
            <div class="boot-mark"></div>
            <div class="boot-label">OPEN INTEGRATION ENGINE</div>
        </div>
    </div>
    <script type="module" src="/main.tsx"></script>
</body>
</html>
